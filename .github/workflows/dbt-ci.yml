name: dbt CI

on:
  push:
    branches: [main]
    paths:
      - "dbt_project/**"
      - ".github/workflows/dbt-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "dbt_project/**"
      - ".github/workflows/dbt-ci.yml"

jobs:
  dbt-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Sobe o Postgres temporário
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: credit_fraud
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          # Forçando a versão exata para evitar o dbt 2.0 (pre-release)
          pip install dbt-core==1.8.10 dbt-postgres==1.8.10

      - name: Create profiles.yml for CI
        run: |
          # Cria a pasta na raiz do projeto (mais seguro que ~/.dbt no Actions)
          mkdir -p profiles
          cat > profiles/profiles.yml <<EOF
          credit_fraud:
            target: dev
            outputs:
              dev:
                type: postgres
                host: localhost
                port: 5432
                user: postgres
                password: postgres
                dbname: credit_fraud
                schema: public
                threads: 4
          EOF

      - name: dbt deps
        run: dbt deps --project-dir dbt_project
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/profiles

      - name: dbt compile
        run: dbt compile --project-dir dbt_project
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/profiles
