# dbt_project/dbt_project.yml
name: 'credit_fraud'
version: '1.0.0'
config-version: 2

profile: 'credit_fraud'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  start_date: '2024-01-01'
  window_1h: '1 hour'
  window_24h: '24 hours'
  window_7d: '7 days'

models:
  credit_fraud:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
