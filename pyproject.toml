[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "dbt_project",
    "notebooks",
    "mlruns",
    "data",
    "reports",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
]

ignore = [
    "E501",  # line-too-long (deixamos para o formatter)
    "B008",  # do not perform function call in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
